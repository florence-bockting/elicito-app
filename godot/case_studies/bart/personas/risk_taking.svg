<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Jonas: takes big risks and sticks to his plan. Big balloon, grin, checklist. Original artwork. -->
  <defs><clipPath id="c"><circle cx="128" cy="128" r="124"/></clipPath></defs>
  <circle cx="128" cy="128" r="124" fill="#f8dcd6"/>
  <g clip-path="url(#c)">
    <!-- big balloon -->
    <path d="M186 112 C186 140 184 170 180 196" stroke="#7a4a40" stroke-width="2" fill="none"/>
    <ellipse cx="186" cy="70" rx="34" ry="38" fill="#e5604f"/>
    <path d="M180 107 L192 107 L186 114 Z" fill="#c4473a"/>
    <ellipse cx="173" cy="55" rx="9" ry="12" fill="#ffffff" opacity="0.45"/>
    <!-- shoulders -->
    <path d="M30 262 C34 200 222 200 226 262 Z" fill="#e5604f"/>
    <path d="M110 204 L128 220 L146 204 Z" fill="#c4473a"/>
    <!-- neck + head -->
    <rect x="113" y="150" width="30" height="40" rx="10" fill="#f3d2b8"/>
    <ellipse cx="128" cy="120" rx="42" ry="48" fill="#f3d2b8"/>
    <!-- swept-up hair -->
    <path d="M86 112 C78 56 150 44 176 82 C178 92 174 104 170 112 C164 92 146 82 124 86 C104 88 92 98 86 112 Z" fill="#c0582c"/>
    <path d="M120 70 C134 50 160 50 172 66 C156 60 140 62 120 70 Z" fill="#a8461f"/>
    <!-- ears -->
    <ellipse cx="86" cy="124" rx="6" ry="10" fill="#e8bfa0"/>
    <ellipse cx="170" cy="124" rx="6" ry="10" fill="#e8bfa0"/>
    <!-- determined brows: inner ends lowered -->
    <path d="M100 100 Q109 101.5 118 106" stroke="#8a3a1a" stroke-width="4" stroke-linecap="round"/>
    <path d="M156 100 Q147 101.5 138 106" stroke="#8a3a1a" stroke-width="4" stroke-linecap="round"/>
    <!-- eyes -->
    <circle cx="110" cy="119" r="4.5" fill="#2b2b2b"/>
    <circle cx="146" cy="119" r="4.5" fill="#2b2b2b"/>
    <!-- confident grin -->
    <path d="M110 140 C120 156 136 156 146 140 Z" fill="#ffffff" stroke="#8a3a2a" stroke-width="3" stroke-linejoin="round"/>
    <!-- checklist: he sticks to the plan -->
    <rect x="58" y="196" width="42" height="54" rx="4" fill="#f6f2ea" stroke="#7a4a40" stroke-width="2"/>
    <rect x="70" y="191" width="18" height="9" rx="2" fill="#7a4a40"/>
    <path d="M65 212 L69 216 L76 207" stroke="#2e6b3a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M80 212 Q87 210.5 94 212" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M65 228 L69 232 L76 223" stroke="#2e6b3a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M80 228 Q87 226.5 94 228" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- hand holding the string -->
    <ellipse cx="180" cy="202" rx="11" ry="9" fill="#f3d2b8"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
