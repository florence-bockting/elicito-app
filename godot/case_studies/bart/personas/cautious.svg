<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Mila: cautious and hesitant. Small balloon, worried brows. Original artwork. -->
  <defs><clipPath id="c"><circle cx="128" cy="128" r="124"/></clipPath></defs>
  <circle cx="128" cy="128" r="124" fill="#dbe8f3"/>
  <g clip-path="url(#c)">
    <!-- small balloon held close -->
    <path d="M196 120 C192 150 186 170 176 196" stroke="#5b6b7a" stroke-width="2" fill="none"/>
    <ellipse cx="197" cy="104" rx="14" ry="16" fill="#4a90c2"/>
    <path d="M193 119 L201 119 L197 124 Z" fill="#3a76a3"/>
    <ellipse cx="192" cy="98" rx="4" ry="5" fill="#ffffff" opacity="0.5"/>
    <!-- hair behind -->
    <path d="M74 112 C72 60 184 60 182 112 L186 178 C170 186 86 186 70 178 Z" fill="#4a2c20"/>
    <!-- shoulders -->
    <path d="M30 262 C34 200 222 200 226 262 Z" fill="#4a90c2"/>
    <path d="M104 204 L128 228 L152 204 Z" fill="#f6f2ea"/>
    <!-- neck + head -->
    <rect x="113" y="150" width="30" height="40" rx="10" fill="#f1c7a5"/>
    <ellipse cx="128" cy="120" rx="42" ry="49" fill="#f1c7a5"/>
    <!-- bangs -->
    <path d="M84 102 C86 64 170 58 174 100 C160 84 130 78 106 86 C98 90 90 96 84 102 Z" fill="#4a2c20"/>
    <!-- worried brows: inner ends raised -->
    <path d="M100 111 Q109 106 118 104" stroke="#3a2219" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M156 111 Q147 106 138 104" stroke="#3a2219" stroke-width="3.5" stroke-linecap="round"/>
    <!-- eyes -->
    <circle cx="110" cy="120" r="4.5" fill="#2b2b2b"/>
    <circle cx="146" cy="120" r="4.5" fill="#2b2b2b"/>
    <!-- small uncertain mouth -->
    <path d="M116 146 C121 142 125 150 130 146 C135 142 138 148 141 146" stroke="#8a4a3a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- blush -->
    <ellipse cx="100" cy="136" rx="7" ry="4" fill="#e8a08a" opacity="0.45"/>
    <ellipse cx="156" cy="136" rx="7" ry="4" fill="#e8a08a" opacity="0.45"/>
    <!-- hand holding the string -->
    <ellipse cx="176" cy="202" rx="11" ry="9" fill="#f1c7a5"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
