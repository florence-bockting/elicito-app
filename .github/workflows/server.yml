# Tests of the Python server in server/
#
# - fast: the protocol, the checks and the BART model, on every push
# - elicito: real elicito fits with the pinned elicito version
# - newest-elicito: once a week, the real fits against the newest elicito
#   release, so a change in elicito's API shows up here before users see it
name: server

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"  # Mondays
  workflow_dispatch:

jobs:
  fast:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install "./server[test]"
      - run: pytest server

  elicito:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "./server[test]"
      - run: pytest server -m elicito
        env:
          RUN_ELICITO: "1"

  newest-elicito:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "./server[test]"
      # beyond the pin in server/pyproject.toml on purpose
      - run: pip install --upgrade elicito
      - run: pip show elicito
      - run: pytest server
        env:
          RUN_ELICITO: "1"
