[project]
name = "elicito-app-server"
version = "0.1.0"
description = "WebSocket server that runs elicito fits for the elicito app (Godot)"
readme = "README.md"
requires-python = ">=3.11, <3.14"
license = "Apache-2.0"
authors = [{ name = "Florence Bockting" }]
dependencies = [
    # The app relies on elicito's API: allow bug-fix releases, check new
    # minor releases in CI (.github/workflows/server.yml) before widening.
    "elicito >= 0.9, < 0.10",
    "fastapi >= 0.110",
    "uvicorn[standard] >= 0.29",
    "numpy >= 1.24",
]

[project.optional-dependencies]
test = ["pytest >= 8", "httpx >= 0.27"]

[project.scripts]
elicito-app-server = "elicito_app_server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elicito_app_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["elicito: runs real elicito fits (slow; set RUN_ELICITO=1)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
