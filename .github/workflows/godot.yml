# Godot tests (GUT) for the app in godot/
name: godot

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: "4.7"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot

      - name: Import the project
        run: ~/godot/godot --headless --path godot --import

      - name: Run GUT
        run: |
          mkdir -p artifacts
          ~/godot/godot --headless --path godot -s addons/gut/gut_cmdln.gd \
            -gexit -gjunit_xml_file="$GITHUB_WORKSPACE/artifacts/gut-junit.xml"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gut-junit
          path: artifacts/
